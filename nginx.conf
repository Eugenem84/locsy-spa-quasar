server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Точка входа SPA (index.html) не должна кэшироваться: браузер обязан получать
    # свежий HTML со ссылками на новые хэшированные ассеты. Иначе после выкладки
    # браузер продолжает работать на старой сборке (реальный баг: уведомления и
    # сообщения оставались на английском, пока не сделаешь hard reload).
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }

    # Хэшированные ассеты: имя файла меняется при каждой сборке, поэтому их можно
    # кэшировать надолго (immutable — чтобы браузер не ходил лишний раз за 304).
    location ~* \.(?:ico|css|js|mjs|gif|jpe?g|png|svg|webp|woff2?|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
