<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="theme-color" content="#052747">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">

    <!-- Превью ссылок в мессенджерах и соцсетях. og:image появится, когда будет
         известен финальный домен: спецификация требует абсолютный URL. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="<%= productName %>">
    <meta property="og:title" content="<%= productName %>">
    <meta property="og:description" content="<%= productDescription %>">

    <!-- CSP для Yandex Maps JS API 3: https://yandex.ru/maps-api/docs/js-api/common/connection/csp.html -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net; img-src 'self' data: blob: https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://yastatic.net; connect-src 'self' http://localhost:* ws://localhost:* https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://*.maps.yandex.net https://log.api-maps.yandex.ru https://yastatic.net; worker-src 'self' blob: data: https://api-maps.yandex.ru https://*.api-maps.yandex.ru https://yastatic.net;">

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
